<!DOCTYPE html>
<html>
  <head>
    <title>Contato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background-color: #1a1a2e; color: white; }
      .navbar { background-color: #16213e; }
      .form-control { background-color: #16213e; color: white; border: 1px solid #00d4ff; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="/">Meu Site</a>
        <div class="navbar-nav">
          <a class="nav-link" href="/sobre">Sobre</a>
          <a class="nav-link" href="/contato">Contato</a>
          <a class="nav-link" href="/dolly">Dolly</a>
        </div>
      </div>
    </nav>
    <div class="container mt-5" style="max-width: 600px;">
      <h1 class="text-center" style="color: #00d4ff;">Contato</h1>
      <form method="POST" action="/contato">
        <div class="mb-3">
          <label>Seu nome:</label>
          <input type="text" name="nome" class="form-control" placeholder="Digite seu nome">
        </div>
        <div class="mb-3">
          <label>Sua mensagem:</label>
          <textarea name="mensagem" class="form-control" rows="4" placeholder="Digite sua mensagem"></textarea>
        </div>
        <button type="submit" class="btn btn-info w-100">Enviar</button>
      </form>
    </div>
  </body>
</html>
