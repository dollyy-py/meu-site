<!DOCTYPE html>
<html>
  <head>
    <title>Mensagem Enviada!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { background-color: #1a1a2e; color: white; }
      .navbar { background-color: #16213e; }
      .card { background-color: #16213e; color: white; border: 1px solid #00d4ff; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="/">Meu Site</a>
        <div class="navbar-nav">
          <a class="nav-link" href="/sobre">Sobre</a>
          <a class="nav-link" href="/contato">Contato</a>
          <a class="nav-link" href="/dolly">Dolly</a>
        </div>
      </div>
    </nav>
    <div class="container text-center mt-5">
      <div class="card p-5">
        <h1 style="color: #00d4ff;">✅ Mensagem enviada!</h1>
        <p class="lead">Obrigado, <strong>{{ nome }}</strong>!</p>
        <p>Sua mensagem foi recebida:</p>
        <p class="fst-italic">"{{ mensagem }}"</p>
        <a href="/" class="btn btn-outline-info mt-3">Voltar para o início</a>
      </div>
    </div>
  </body>
</html>
